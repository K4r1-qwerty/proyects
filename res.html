<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Flores Eternas - Reseñas</title>
    <link rel="preload" href="css/normalize.css" as="style">
    <link rel="stylesheet" href="css/normalize.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Krub:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
   <header> 
        <div class="fondo">
            <div class="contenido-fondo">
                <h1>Flores Eternas</h1>
            </div>
        </div>
    </header>
    <div class="nav-bg">
    <nav class="navegacion-principal contenedor">
             <a href="index.html">Inicio </a>
             <a href="cat.html">Catálogo </a>
             <a href="res.html">Reseñas </a>
             <a href="cont.html">Contacto </a>
    </nav>
    </div>
    <main class="cuadro-forma1">
        <h2>Reseñas</h2>
    <form class="formulario">
        <fieldset>
            <legend>Si desea dejar una reseña favor de completar el siguiente formulario:</legend>
                <div class="contenedor-campos"></div>
                <div class="campo">
                    <label for="name">Nombre:</label>
                    <input class="input-text" type="text" placeholder="Tu nombre">
                </div>
                <div class="campo">
                    <label for="review">Reseña:</label>
                    <textarea class="input-text" placeholder="Tu reseña"></textarea>
                </div>
                <div class="campo">
                    <label for="rating">Calificación:</label>
                    <div class="contenedor-estrella">
                    <div class="estrella">
                        <input type="radio" id="rating5" name="rating" value="5">
                        <label>★★★★★</label>
                    </div>
                    <div class="estrella">
                        <input type="radio" id="rating4" name="rating" value="4"">
                        <label>★★★★</label>
                    </div>
                    <div class="estrella">
                        <input type="radio" id="rating3" name="rating" value="3">
                        <label>★★★</label>
                    </div>
                    <div class="estrella">
                        <input type="radio" id="rating2" name="rating" value="2">
                        <label>★★</label>
                    </div>
                    <div class="estrella">
                        <input type="radio" id="rating1" name="rating" value="1">
                        <label>★</label>
                    </div>
                    </div>
                </div>
                <div class="contenedor-boton">
                    <input class="boton" type="submit" value="Enviar">
                </div>
        </fieldset>
    </form>
</main>
<footer>
    <p>Todos los derechos reservados. Flores Eternas by Karina Uribe.</p>
</footer>
</body>

</html>
