<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Flores Eternas - Reseñas</title>
    <link rel="preload" href="css/normalize.css" as="style">
    <link rel="stylesheet" href="css/normalize.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Krub:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
   <header> 
        <div class="fondo">
            <div class="contenido-fondo">
                <h1>Flores Eternas</h1>
            </div>
        </div>
    </header>
    <div class="nav-bg">
    <nav class="navegacion-principal contenedor">
             <a href="index.html">Inicio </a>
             <a href="cat.html">Catalogo </a>
             <a href="res.html">Reseñas </a>
             <a href="cont.html">Contacto </a>
    </nav>
    </div>
    <main class="cuadro-forma1">
    <form>
        <fieldset>
            <legend>Si desea dejar una reseña favor de completar el siguiente formulario:</legend>
                <div>
                    <label for="name">Nombre:</label>
                    <input type="text" id="name" name="name" required><br><br>
                </div>
                <div>
                    <label for="review">Reseña:</label><br>
                    <textarea id="review" name="review" rows="4" cols="50" required></textarea><br><br>
                </div>
                <div>
                    <label for="rating">Calificación:</label>
                    <select id="rating" name="rating" required>
                        <option value="">Seleccione una calificación</option>
                        <option value="1">1 estrella</option>
                        <option value="2">2 estrellas</option>
                        <option value="3">3 estrellas</option>
                        <option value="4">4 estrellas</option>
                        <option value="5">5 estrellas</option>
                    </select><br><br>
                </div>
                <div>
                    <input type="submit" value="Enviar Reseña">
                </div>
        </fieldset>
    </form>
</main>
<footer>
    <p>Todos los derechos reservados. Flores Eternas by Karina Uribe.</p>
</footer>
</body>

</html>
